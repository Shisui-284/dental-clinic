server:
  port: 8080

spring:
  application:
    name: dental-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/dental_clinic?currentSchema=public
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  jwt:
    # Khóa bí mật >= 256-bit (tối thiểu 32 ký tự) cho HS256
    secret: ${JWT_SECRET:chia-dental-clinic-prototype-secret-key-2026-256bit}
    expiration-ms: 86400000 # 24 giờ
  otp:
    expire-minutes: 5
    max-retries: 5
    lock-minutes: 30
    prototype-expose-code: true # Chỉ bật ở môi trường prototype/dev để dễ test trên Swagger/Postman
  scheduling:
    enabled: true
    hold-expiration-ms: 60000 # Quét lịch PENDING quá hạn hold_until mỗi 1 phút (5.3.6)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

